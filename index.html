    :root {
      --gp-blue: #0F4C81;
      --gp-royal: #1D4ED8;
      --gp-light-blue: #EFF6FF;
      --gp-border: #E2E8F0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #F4F7FB;
      color: #0F172A;
      margin: 0;
      overflow-x: hidden;
    }

    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Login Background Subtle Blue-White Mesh */
    .login-bg {
      background:
        radial-gradient(circle at 12% 18%, rgba(29, 78, 216, 0.09) 0%, transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(15, 76, 129, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
    }

    /* Department Card Hover & Click Color Wave Animation */
    .dept-card {
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 18px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.28s ease;
      cursor: pointer;
    }

    .dept-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .dept-card[data-role="boss"]::before {
      background: linear-gradient(135deg, rgba(15, 76, 129, 0.07) 0%, rgba(29, 78, 216, 0.02) 100%);
    }
    .dept-card[data-role="service"]::before {
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.07) 0%, rgba(16, 185, 129, 0.02) 100%);
    }
    .dept-card[data-role="social"]::before {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.07) 0%, rgba(99, 102, 241, 0.02) 100%);
    }

    /* Hover State */
    .dept-card:hover {
      transform: translateY(-5px);
    }
    .dept-card:hover::before {
      opacity: 1;
    }
    .dept-card[data-role="boss"]:hover {
      border-color: #1D4ED8;
      box-shadow: 0 14px 30px -10px rgba(29, 78, 216, 0.24);
    }
    .dept-card[data-role="service"]:hover {
      border-color: #059669;
      box-shadow: 0 14px 30px -10px rgba(5, 150, 105, 0.24);
    }
    .dept-card[data-role="social"]:hover {
      border-color: #4F46E5;
      box-shadow: 0 14px 30px -10px rgba(79, 70, 229, 0.24);
    }

    /* Active Selected State */
    .dept-card.active-boss {
      border-color: #0F4C81;
      background: linear-gradient(180deg, #FFFFFF 0%, #EFF6FF 100%);
      box-shadow: 0 14px 32px -8px rgba(15, 76, 129, 0.28), 0 0 0 4px rgba(29, 78, 216, 0.12);
      transform: translateY(-4px);
    }
    .dept-card.active-service {
      border-color: #059669;
      background: linear-gradient(180deg, #FFFFFF 0%, #ECFDF5 100%);
      box-shadow: 0 14px 32px -8px rgba(5, 150, 105, 0.28), 0 0 0 4px rgba(16, 185, 129, 0.12);
      transform: translateY(-4px);
    }
    .dept-card.active-social {
      border-color: #4F46E5;
      background: linear-gradient(180deg, #FFFFFF 0%, #EEF2FF 100%);
      box-shadow: 0 14px 32px -8px rgba(79, 70, 229, 0.28), 0 0 0 4px rgba(99, 102, 241, 0.12);
      transform: translateY(-4px);
    }

    /* Click Ripple Wave */
    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: rippleAnim 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to {
        transform: scale(3.2);
        opacity: 0;
      }
    }

    /* Auth Box Smooth Color Shift */
    .auth-box {
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
    }

    /* Sidebar & Dashboard */
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      transition: all 0.2s ease;
      text-align: left;
      white-space: nowrap;
    }
    .nav-btn:hover {
      background: #F1F5F9;
      color: #0F4C81;
    }
