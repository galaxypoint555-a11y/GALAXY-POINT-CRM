<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galaxy Point | Enterprise Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Core Reset & White Background */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light clean white/grey */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            text-align: center;
        }

        /* Header */
        .brand-header { margin-bottom: 50px; }
        .brand-title {
            font-size: 38px; font-weight: 800; color: #1e3a8a; /* Corporate Blue */
            letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase;
        }
        .brand-subtitle {
            font-size: 15px; color: #64748b; letter-spacing: 3px; text-transform: uppercase; font-weight: 500;
        }

        /* Grid System */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Premium White Cards */
        .portal-card {
            background: #ffffff; border-radius: 20px; padding: 40px 30px;
            text-decoration: none; color: #1e293b; position: relative;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.1); 
            border-color: #bfdbfe;
        }

        /* Icons */
        .card-icon {
            font-size: 45px; margin-bottom: 20px; background: #eff6ff;
            width: 90px; height: 90px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; transition: transform 0.3s ease;
        }
        .portal-card:hover .card-icon { transform: scale(1.05); background: #dbeafe; }

        /* Text */
        .card-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #0f172a; }
        .card-desc { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 30px; max-width: 260px; }

        /* Buttons */
        .login-btn {
            margin-top: auto; padding: 12px 30px; background: #2563eb; color: #ffffff;
            border-radius: 50px; font-weight: 600; font-size: 14px;
            transition: all 0.3s ease; text-transform: uppercase; border: none; width: 100%;
        }
        .portal-card:hover .login-btn {
            background: #1d4ed8; box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        @media (max-width: 768px) {
            .brand-title { font-size: 30px; }
            .portal-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <div class="brand-header">
            <div class="brand-title">◈ GALAXY POINT</div>
            <div class="brand-subtitle">Enterprise CRM Portal</div>
        </div>

        <!-- Yahan Cards Automatically Generate Honge -->
        <div class="portal-grid" id="card-container"></div>
    </div>

    <script>
        // ⚡ SMART ENGINE: Aage jo change karna ho, sirf yahan karein
        const portalCards = [
            {
                title: "Boss Dashboard",
                icon: "👑",
                desc: "Access complete business analytics, revenue overview, and monitor department performance.",
                link: "boss-panel.html"
            },
            {
                title: "Social Media CRM",
                icon: "📱",
                desc: "Manage customer leads, track acquisition sources, and transfer tasks to other departments.",
                link: "social-media.html"
            },
            {
                title: "Service Centre",
                icon: "🛠️",
                desc: "Track repair jobs, update statuses, manage service bills, and view Sohail referrals.",
                link: "service-centre.html"
            }
        ];

        // Yeh code automatic cards ko screen par print karega
        const container = document.getElementById('card-container');
        
        portalCards.forEach(card => {
            container.innerHTML += `
                <a href="${card.link}" class="portal-card">
                    <div class="card-icon">${card.icon}</div>
                    <h2 class="card-title">${card.title}</h2>
                    <p class="card-desc">${card.desc}</p>
                    <div class="login-btn">Secure Login</div>
                </a>
            `;
        });
    </script>
</body>
</html>
