    :root {

      --gp-royal: #1D4ED8;
      --gp-light-blue: #EFF6FF;
      --gp-border: #E2E8F0;

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #F4F7FB;
      color: #0F172A;
      margin: 0;
      overflow-x: hidden;

    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Login Background Subtle Blue-White Mesh */
    .login-bg {
      background:
        radial-gradient(circle at 12% 18%, rgba(29, 78, 216, 0.09) 0%, transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(15, 76, 129, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
    }

    /* Department Card Hover & Click Color Wave Animation */
    .dept-card {
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 18px;

                  box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.28s ease;
      cursor: pointer;
    }
